[project]
name = "ecs-dns-updater"
version = "0.1.0"
description = "Updates Cloudflare A/AAAA records to an ECS service's own public IP on startup"
authors = [{name = "Melvyn de Kort", email = "melvyn@mdekort.nl"}]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pylint>=3.3.9",
    "moto>=5.0.0",
    "responses>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ecs_dns_updater"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
